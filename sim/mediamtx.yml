# Camera giả lập cho Frigate (service rtsp-sim trong docker-compose.yml).
# Khác mediamtx.yml ở gốc repo: file kia chạy trên host cho module thử một mình,
# file này chạy trong Docker và tự phát video, giống một camera IP có 2 luồng.
#
# Video lấy từ data/samples/ (thư mục đã gitignore, không commit video).
# Mỗi camera cần 2 path: <camera> (luồng chính, để ghi hình) và <camera>_sub
# (luồng phụ, để detect) — đúng như camera Hikvision/Dahua thật.

logLevel: warn

rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  # Luồng chính 720p, 2 Mbps như camera IP thật (không giới hạn thì ultrafast ra ~4,5 Mbps,
  # ghi liên tục ~48 GB/ngày). -g 25: keyframe mỗi ~1 giây để Frigate cắt đoạn ghi hình gọn.
  # -rtsp_transport tcp: đẩy luồng bằng TCP như restream của Frigate, tránh rơi gói UDP.
  xuong_han:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /media/xuong_han.mp4
      -map 0:v:0 -vf scale=-2:720 -c:v libx264 -preset ultrafast -tune zerolatency -g 25
      -b:v 2M -maxrate 2M -bufsize 4M
      -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # Luồng phụ 360p, 10 FPS — Frigate và module detect ở 5 FPS nên không cần hơn.
  # Lấy từ luồng chính thay vì đọc file lần nữa, để hai luồng luôn cùng một khoảnh
  # khắc (quan trọng khi đo độ trễ B3 và đối chiếu ghi hình với sự cố của module).
  # Lúc luồng chính chưa lên thì ffmpeg lỗi và runOnInitRestart tự chạy lại.
  xuong_han_sub:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -i rtsp://localhost:$RTSP_PORT/xuong_han
      -map 0:v:0 -vf scale=-2:360,fps=10 -c:v libx264 -preset ultrafast -tune zerolatency -g 10
      -b:v 500k -maxrate 500k -bufsize 1M
      -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # --- 3 camera kho, chỉ ghi hình (tuần 8, mốc M3) ---------------------------
  # Dùng chung tệp video với xuong_han để khỏi phải quay thêm; Frigate tắt detect
  # cho mấy camera này nên chỉ có một luồng 720p, không cần luồng phụ.
  # Mỗi camera lệch giờ bắt đầu một ít (-ss) cho khác nhau, nhìn vào Frigate đỡ rối.
  #
  # -c:v copy, KHÔNG mã hoá lại: tệp sẵn là H.264 720p rồi. Mã hoá lại 3 luồng nữa
  # làm rtsp-sim ngốn hơn 130% CPU, Frigate bắt đầu rớt khung (camera_fps tụt còn
  # 3,8 và log báo i/o timeout) — đo tài nguyên B4 lúc đó là đo máy giả lập, không
  # phải đo hệ thống thật.
  kho_1:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -ss 3 -i /media/xuong_han.mp4
      -map 0:v:0 -c:v copy
      -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  kho_2:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -ss 9 -i /media/xuong_han.mp4
      -map 0:v:0 -c:v copy
      -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  kho_3:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -ss 15 -i /media/xuong_han.mp4
      -map 0:v:0 -c:v copy
      -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # Thêm camera giả lập nữa: chép một khối trên, đổi tên và tệp video, rồi khai
  # camera tương ứng trong frigate/config.yml.
